# Codex configuration for the ModelScope worker.
#
# Install to ${CODEX_HOME}/config.toml (ms-worker.sh defaults CODEX_HOME to
# ~/.codex-executor). The worker refuses to execute when this file is absent:
# without it there is no way to prove the model is a free-tier one.
#
# wire_api MUST be "responses". Codex 0.152.x removed the "chat" wire API:
#   Error loading config.toml: `wire_api = "chat"` is no longer supported.
# OpenRouter does speak the responses protocol, so this works.
#
# Any model id ending in ":free" satisfies the worker's guard.
#
# Benchmarked on the same smoke task (create GREETING.md, one line):
#   recursive/flint-v1.0:free        9,554 tokens  ~33s  correct
#   cohere/north-mini-code:free     33,842 tokens   ~31s  correct
# flint is the default for token efficiency; cohere is the fallback.
# Other working ids: dots-studio/dots-3-note-preview:free
# Known bad: nvidia/nemotron-3-lightning:free (upstream error),
#            xingchen-agi/xing4.0-29b-a4b:free and google/gemma-4-31b-it:free
#            (429 from upstream, not account quota)

model = "recursive/flint-v1.0:free"
model_provider = "openrouter"
model_reasoning_effort = "low"

[model_providers.openrouter]
name = "OpenRouter"
base_url = "https://openrouter.ai/api/v1"
env_key = "OPENROUTER_API_KEY"
wire_api = "responses"
