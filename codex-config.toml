# Codex configuration for the ModelScope worker.
#
# Install to ${CODEX_HOME}/config.toml (ms-worker.sh defaults CODEX_HOME to
# ~/.codex-executor). The worker refuses to execute when this file is absent:
# without it there is no way to prove which model is being used.
#
# wire_api MUST be "responses". Codex 0.152+ removed the "chat" wire API.
#
# Model choice: qwen/qwen3-coder via OpenRouter.
#   - code-specialised, $0.30/M input, $1.00/M output -> roughly $0.03 per job
#   - OpenAI models via OpenRouter /responses are rejected with 403 (provider
#     ToS), so the model must come from another vendor
#
# This is a PAID model. The free-tier models were tried and all failed at the
# editing step:
#   recursive/flint-v1.0:free    worked, but OpenRouter 429s after ~16 jobs
#   Qwen/Qwen3.5-27B (ModelScope) completes, but apply_patch "does not exist"
#                                 and it narrates the fallback instead of running it
#   ZhipuAI/GLM-5.2 (ModelScope)  stream closed before response.completed
#
# Because the model id does not end in :free, the worker's guard requires
# ALLOW_NONFREE_MODEL=1. That is intentional here: we are paying on purpose.

model = "qwen/qwen3-coder"
model_provider = "openrouter"
model_reasoning_effort = "low"

[model_providers.openrouter]
name = "OpenRouter"
base_url = "https://openrouter.ai/api/v1"
env_key = "OPENROUTER_API_KEY"
wire_api = "responses"

